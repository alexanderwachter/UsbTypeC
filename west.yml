# West manifest making this repository a Zephyr workspace application:
#
#   west init -m https://github.com/alexanderwachter/UsbTypeC workspace
#   cd workspace
#   west update
#   west build -b stm32g081b_eval usbc/samples/sink
#
# Copyright (c) 2026 Alexander Wachter
# SPDX-License-Identifier: Apache-2.0

manifest:
  self:
    path: usbc

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: mtl
      url: https://github.com/alexanderwachter/McuTemplateLibrary
      revision: a4ead70ad042fb88130d39f5de7d9a107055cbda
      path: modules/lib/mtl
      # west fsm_dotgen (DOT graphs of the tables) and west
      # fsm_liveview (watch or replay machines in the browser)
      west-commands: zephyr/scripts/west-commands.yml

    - name: zephyr
      remote: zephyrproject
      revision: v4.4.0
      import:
        # only what the sample boards need
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_stm32

# West manifest making this repository a Zephyr workspace application:
#
#   west init -m https://github.com/alexanderwachter/UsbTypeC workspace
#   cd workspace
#   west update
#   west build -b stm32g081b_eval usbc/samples/sink
#
# Copyright (c) 2026 Alexander Wachter
# SPDX-License-Identifier: Apache-2.0

manifest:
  self:
    path: usbc

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v4.4.0
      import:
        # only what the sample boards need
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_stm32

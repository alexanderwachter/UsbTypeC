# West manifest making this repository a Zephyr workspace application:
#
#   west init -m https://github.com/alexanderwachter/UsbTypeC workspace
#   cd workspace
#   west update
#   west build -b stm32g081b_eval usbc/samples/sink
#
# Copyright (c) 2026 Alexander Wachter
# SPDX-License-Identifier: Apache-2.0

manifest:
  self:
    path: usbc

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    # mtl as a Zephyr module (CONFIG_MTL): west update fetches it, the
    # build discovers its Kconfig and cmake on its own. Keep the
    # revision in lockstep with the lib/McuTemplateLibrary submodule,
    # which the host (cmake) build and the fsm headers build against
    - name: mtl
      url: https://github.com/alexanderwachter/McuTemplateLibrary
      revision: b1814b1ffe7d05cd10d97d5541d4c1c95899f8a3
      path: modules/lib/mtl
      # west fsm_dotgen (DOT graphs of the tables) and west
      # fsm_liveview (watch or replay machines in the browser)
      west-commands: zephyr/scripts/west-commands.yml

    - name: zephyr
      remote: zephyrproject
      revision: v4.4.0
      import:
        # only what the sample boards need
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_stm32
